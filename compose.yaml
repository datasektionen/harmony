services:
  app:
    build:
      context: .
      target: src
    command: npm run dev
    environment:
      - NODE_ENV=development
      - SPAM_API_TOKEN=spam-secret
      - SPAM_URL=http://spam:3000
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src/tests/local/testConf.json:/app/dist/tests/local/testConf.json:ro
    develop:
      watch:
        - action: sync
          path: .
          target: /app
        - action: rebuild
          path: package-lock.json
  
  # Postgres database
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_PASSWORD=harmony
      - POSTGRES_USER=harmony
      - POSTGRES_DB=harmony
    healthcheck:
      test:
        - "CMD-SHELL"
        - "sh -c 'pg_isready -d harmony -U harmony'"
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Nyckeln under dörrmattan
  nyckeln:
    image: ghcr.io/datasektionen/nyckeln-under-dorrmattan:latest
    configs:
      - source: nyckeln.yaml
        target: /config.yaml
    ports:
      - 7001:7001
      - 7002:7002
      - 7003:7003
      - 7004:7004
      - 7005:7005
  
  # Spam
  spam:
    image: ghcr.io/datasektionen/spam-rs:latest
    ports:
      - 3000:3000
    environment:
      RUST_LOG: debug
      HOST_ADDRESS: 0.0.0.0
      PORT: 3000
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: aws-ses-v2-local
      AWS_ENDPOINT_URL: http://aws-ses:8005
      APP_SECRET: insert-app-secret
      HIVE_URL: http://nyckeln:7004/api/v1
      HIVE_SECRET: aaaa

  smtp:
    image: changemakerstudiosus/papercut-smtp
    container_name: smtp
    ports:
      - 8080:8080
      - 2525:2525
    environment:
      Urls: http://0.0.0.0:8080
      SmtpServer__Port: 2525

  aws-ses:
    container_name: aws-ses-v2-local
    hostname: aws-ses-v2-local
    image: ghcr.io/domdomegg/aws-ses-v2-local
    environment:
      AWS_SES_ACCOUNT: '{"SendQuota":{"Max24HourSend":1000000,"MaxSendRate":250,"SentLast24Hours":0}}'
      SMTP_TRANSPORT: '{"host":"smtp","port":2525,"secure":false}'
    working_dir: /srv/www/dist
    ports:
      - "8005:8005"
    expose:
      - 8005

