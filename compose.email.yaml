# Docker compose overrides for building Harmony
# with a mock of the Spam system and an email
# client.
#
# Build with 'docker compose -f compose.yaml -f compose.email.yaml up --build'
# to use the provided overrides.

services:
  # Overrides for environment variables.
  app:
    environment:
      - SPAM_API_TOKEN=spam-secret
      - SPAM_URL=http://spam:3000
  
  # Spam
  spam:
    image: ghcr.io/datasektionen/spam-rs:latest
    platform: linux/amd64
    ports:
      - 3000:3000
    environment:
      RUST_LOG: debug
      HOST_ADDRESS: 0.0.0.0
      PORT: 3000
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: aws-ses-v2-local
      AWS_ENDPOINT_URL: http://aws-ses:8005
      APP_SECRET: insert-app-secret
      HIVE_URL: http://nyckeln:7004/api/v1
      HIVE_SECRET: aaaa

  smtp:
    image: changemakerstudiosus/papercut-smtp
    container_name: smtp
    ports:
      - 8080:8080
      - 2525:2525
    environment:
      Urls: http://0.0.0.0:8080
      SmtpServer__Port: 2525

  aws-ses:
    container_name: aws-ses-v2-local
    hostname: aws-ses-v2-local
    image: ghcr.io/domdomegg/aws-ses-v2-local
    environment:
      AWS_SES_ACCOUNT: '{"SendQuota":{"Max24HourSend":1000000,"MaxSendRate":250,"SentLast24Hours":0}}'
      SMTP_TRANSPORT: '{"host":"smtp","port":2525,"secure":false}'
    working_dir: /srv/www/dist
    ports:
      - "8005:8005"
    expose:
      - 8005

# Set up Hive secrets for Spam.
configs:
  nyckeln.yaml:
    content: |
      hive:
        tokens:
          - secret: spam-secret
            permissions:
              - id: send
                scope: null

